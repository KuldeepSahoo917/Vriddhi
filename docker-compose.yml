services:
  backend:
    build:
      context: ./backend
    container_name: vriddhi-backend
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: vriddhi-frontend
    ports:
      - "1919:80"
    depends_on:
      - backend
    restart: unless-stopped
